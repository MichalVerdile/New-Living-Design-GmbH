<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>NLD – lokale Qualitätsprüfung</title>
<style>body{margin:0;background:#ebe8df;color:#23302b;font:14px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;padding:10px}iframe{display:block;border:0;background:white;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px}label{display:flex;gap:8px;align-items:center}#progress{padding:12px;display:block}</style></head>
<body><header><label>Breite <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option><option>1440</option><option>1920</option></select></label><label>Höhe <input id="height" type="number" value="844" style="width:80px"></label><label>Seite <input id="path" value="/" style="width:280px"></label><button id="apply">Ansicht laden</button><label><input id="current" type="checkbox">Nur gewählte Seite</label><button id="audit">Seiten und Breiten prüfen</button><button id="flows">Interaktionen prüfen</button></header>
<strong id="progress" role="status">Bereit. Nur lokal; Formularanfragen werden im Interaktionstest abgefangen.</strong><iframe id="preview" title="Website Vorschau" width="390" height="844" src="/"></iframe><pre id="result"></pre>
<script type="module">
const frame=document.querySelector('#preview'), result=document.querySelector('#result'), progress=document.querySelector('#progress');
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function until(check,label){for(let i=0;i<100;i++){if(check())return;await pause(60)}throw Error('Zeitüberschreitung: '+label)}
async function load(path){await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=path});await until(()=>frame.contentWindow.location.pathname===path&&frame.contentDocument.querySelector('#root main h1')&&frame.contentDocument.querySelector('nav[aria-label="Hauptnavigation"]'),path);await pause(120)}
function publish(data){result.textContent=JSON.stringify(data,null,2)}
document.querySelector('#apply').onclick=()=>{frame.width=document.querySelector('#width').value;frame.height=document.querySelector('#height').value;frame.src=document.querySelector('#path').value};
document.querySelector('#audit').onclick=async()=>{
const data={date:new Date().toISOString(),environment:'Chromium, CSS viewport simulation via same-origin iframe; no CPU/network throttling; finite animations advanced to their final state before contrast scanning',pages:[],errors:[]};
try{const routes=document.querySelector('#current').checked?[document.querySelector('#path').value]:await(await fetch('./routes.json')).json();for(const route of routes){progress.textContent=`Prüfe ${data.pages.length+1}/${routes.length}: ${route}`;await load(route);const doc=frame.contentDocument, win=frame.contentWindow;const row={route,title:doc.title,h1:doc.querySelectorAll('main h1').length,layouts:[],axe:[]};
for(const width of [320,375,390,430,768,1024,1280,1440,1920]){frame.width=width;frame.height=width<768?844:900;await pause(110);row.layouts.push({width,clientWidth:doc.documentElement.clientWidth,scrollWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth+1})}
// Landscape plus 200% reflow equivalent at a 1280px desktop width.
for(const size of [[844,390],[640,450]]){frame.width=size[0];frame.height=size[1];await pause(110);row.layouts.push({width:size[0],height:size[1],clientWidth:doc.documentElement.clientWidth,scrollWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth+1})}
frame.width=390;frame.height=844;await pause(1000);row.title=doc.title;row.h1=doc.querySelectorAll('main h1').length;for(const a of doc.getAnimations()){try{if(a.effect.getTiming().iterations!==Infinity)a.finish()}catch{/* scroll timelines have no finite end */}}const script=doc.createElement('script');script.src='/node_modules/axe-core/axe.min.js';doc.head.append(script);await until(()=>win.axe,'axe-core');const scan=await win.axe.run(doc,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});row.axe=scan.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}));row.incomplete=scan.incomplete.map(v=>({id:v.id,count:v.nodes.length}));data.pages.push(row);publish(data)}progress.textContent=`Abgeschlossen: ${data.pages.length} Seiten; ${data.pages.reduce((n,p)=>n+p.layouts.filter(v=>v.overflow).length,0)} Überläufe; ${data.pages.reduce((n,p)=>n+p.axe.length,0)} axe-Regelverletzungen.`}
catch(e){data.errors.push(String(e));progress.textContent='Prüfung unterbrochen: '+e;publish(data)}
};
document.querySelector('#flows').onclick=async()=>{
const checks=[];const assert=(name,condition)=>{checks.push({name,passed:!!condition});if(!condition)throw Error(name)};const button=(doc,text)=>[...doc.querySelectorAll('button')].find(e=>e.textContent.includes(text)||e.getAttribute('aria-label')===text);
try{progress.textContent='Prüfe lokale Interaktionen …';frame.width=390;await load('/kontakt');let doc=frame.contentDocument,win=frame.contentWindow;let requests=0;win.fetch=async()=>{requests++;return new win.Response(JSON.stringify({errors:[{message:'Lokaler Testfehler'}]}),{status:500,headers:{'Content-Type':'application/json'}})};
const form=doc.querySelector('#kontaktformular');form.requestSubmit();await pause(80);assert('Leeres Formular sendet nicht',requests===0);assert('Fehler fokussiert Vorname',doc.activeElement?.id==='contact-firstName');assert('Pflichtfelder werden markiert',form.querySelectorAll('[aria-invalid="true"]').length===4);
for(const input of form.querySelectorAll('[required]')){input.value=input.type==='email'?'ungueltig':'Test';input.dispatchEvent(new win.Event('input',{bubbles:true}))}form.requestSubmit();await pause(80);assert('Ungültige E-Mail sendet nicht',requests===0);assert('E-Mail-Fehler ist verknüpft',doc.querySelector('#contact-email').getAttribute('aria-describedby')==='error-email');
doc.querySelector('#contact-email').value='qa@example.invalid';form.requestSubmit();await pause(100);assert('HTTP-Fehler ist sichtbar',doc.querySelector('[role="alert"]')?.textContent.includes('Lokaler Testfehler'));assert('Eingaben bleiben nach Fehler erhalten',doc.querySelector('#contact-firstName').value==='Test');
win.fetch=async()=>{requests++;await pause(100);return new win.Response('{}',{status:200})};form.requestSubmit();form.requestSubmit();await pause(180);assert('Doppelklick wird abgefangen',requests===2);assert('Erfolg wird angezeigt',doc.querySelector('[role="status"]')?.textContent.includes('Danke.'));assert('Formular wird nach Erfolg geleert',doc.querySelector('#contact-firstName').value==='');
await load('/referenzen');doc=frame.contentDocument;win=frame.contentWindow;const opener=[...doc.querySelectorAll('button')].find(b=>b.getAttribute('aria-label')?.includes('vergrössern'));assert('Referenzgalerie kann geöffnet werden',!!opener);opener.focus();opener.click();await pause(80);const dialog=doc.querySelector('dialog');assert('Lightbox ist modal geöffnet',dialog?.open);button(doc,'Nächstes Bild').click();await pause(80);assert('Bildnavigation aktualisiert Zähler',dialog.querySelector('[role="status"]').textContent.startsWith('2'));button(doc,'Vergrössern').click();await pause(50);assert('Zoom kann aktiviert werden',button(doc,'Gesamtbild')?.getAttribute('aria-pressed')==='true');dialog.dispatchEvent(new win.Event('cancel',{cancelable:true}));await pause(60);assert('Schliessen stellt Fokus wieder her',!doc.querySelector('dialog')&&doc.activeElement===opener);
await load('/badplaner');doc=frame.contentDocument;assert('Badplaner zeigt drei Schritte',doc.querySelectorAll('nav[aria-label="Planungsschritte"] button').length===3);assert('Spätere Schritte sind ohne Auswahl gesperrt',doc.querySelectorAll('nav[aria-label="Planungsschritte"] button:disabled').length===2);
progress.textContent=`Abgeschlossen: ${checks.length} Interaktionsprüfungen.`;publish({checks})}catch(e){progress.textContent='Interaktionsprüfung fehlgeschlagen: '+e;publish({checks,error:String(e)})}
};
</script></body></html>
